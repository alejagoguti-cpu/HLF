<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>UNICENTRO · Bogotá · Visor 3D</title>
  <link rel="stylesheet" href="./src/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <header class="card">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M12 2 21 7v10l-9 5-9-5V7z" />
      <path d="M3 7l9 5 9-5M12 12v10" />
    </svg>
    <div>
      <h1>UNICENTRO</h1>
      <p>Bogotá · contexto andino</p>
    </div>
  </header>

  <div class="clock">
    <span id="sun-label">Día</span>
  </div>

  <footer class="bar-ui">
    <div class="group">
      <button data-time="dia" class="on">Día</button>
      <button data-time="tarde">Tarde</button>
      <button data-time="noche">Noche</button>
    </div>
    <div class="group">
      <button id="btn-home">Vista general</button>
    </div>
  </footer>

  <div id="stats"></div>

  <div id="loader">
    <div class="loader-inner">
      <div class="spinner"></div>
      <div class="track"><div id="bar"></div></div>
      <div id="pct">0%</div>
      <p>Cargando escena</p>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
